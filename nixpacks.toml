# Nixpacks config for Coolify — the Node backend lives in backend/
# (repo root has no package.json, so auto-detection needs this file)

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["cd backend && (npm ci --omit=dev || npm install --omit=dev)"]

[start]
cmd = "cd backend && node server.js"
