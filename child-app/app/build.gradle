plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.familyguard.child'
    compileSdk 34
    defaultConfig {
        applicationId "com.familyguard.child"
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName "1.13"
    }
    // FIXED SIGNING KEY — auto-update ki JAAN. GitHub runner har baar fresh hota
    // hai; AGP tab har build par NAYA random debug keystore banata tha => har
    // release APK ki signature alag => phone par install-over-existing HAMESHA
    // fail ("App not installed" / signatures do not match) => silent update +
    // manual update dono kabhi kaam hi nahi karte the. Ab repo ke andar ek hi
    // keystore (debug-grade, private family app — threat model low) se har build
    // sign hota hai: local ho ya CI, signature SAME. Ek baar is key wala build
    // install ho gaya to agli saari updates — silent ya manual — seedha lagengi.
    signingConfigs {
        fixed {
            storeFile file("../keystore/familyguard.keystore")
            storePassword "familyguard"
            keyAlias "familyguard"
            keyPassword "familyguard"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
