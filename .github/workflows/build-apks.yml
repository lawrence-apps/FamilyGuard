name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  parent-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build parent app
        working-directory: parent-app
        run: gradle assembleDebug --no-daemon

      - name: Upload parent APK
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-parent-debug-apk
          path: parent-app/app/build/outputs/apk/debug/app-debug.apk

  child-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build child app
        working-directory: child-app
        run: gradle assembleDebug --no-daemon

      - name: Upload child APK
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-child-debug-apk
          path: child-app/app/build/outputs/apk/debug/app-debug.apk
